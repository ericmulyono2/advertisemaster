<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AdvertiseMaster Ad</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:#0a0e1a}
  #stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .bg{position:absolute;inset:0;z-index:0}
  .bg .grad{position:absolute;inset:-20%;background:linear-gradient(120deg,var(--c1),var(--c2),var(--c3));
    background-size:200% 200%;animation:shift 9s ease infinite;filter:saturate(1.1)}
  @keyframes shift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;mix-blend-mode:screen}
  .b1{width:55%;height:55%;background:var(--g1);top:-15%;left:-10%}
  .b2{width:50%;height:50%;background:var(--g2);bottom:-18%;right:-12%}
  .noise{position:absolute;inset:0;opacity:.06;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:5px 5px}
  .card{position:relative;z-index:2;width:88%;max-width:760px;text-align:center;color:#fff;padding:24px}
  .badge{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.28);padding:7px 15px;border-radius:999px;font-size:13px;font-weight:700;
    letter-spacing:.3px;margin-bottom:22px}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff;animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.3}}
  .emoji-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;margin-bottom:18px}
  .emoji-wrap .ring{position:absolute;width:190px;height:190px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%)}
  .emoji{font-size:120px;line-height:1;filter:drop-shadow(0 14px 30px rgba(0,0,0,.4))}
  .brand{font-size:clamp(34px,7vw,64px);font-weight:900;letter-spacing:-1.5px;line-height:1.05;
    text-shadow:0 6px 30px rgba(0,0,0,.3)}
  .brand .ch{display:inline-block}
  .tag{font-size:clamp(15px,2.4vw,23px);font-weight:600;opacity:.95;margin-top:12px;text-shadow:0 2px 12px rgba(0,0,0,.3)}
  .feats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  .chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px);
    padding:9px 15px;border-radius:12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
  .chip .ck{color:#fff}
  .row{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:28px;flex-wrap:wrap}
  .price{font-size:clamp(22px,4vw,38px);font-weight:900;text-shadow:0 4px 18px rgba(0,0,0,.35)}
  .price small{display:block;font-size:12px;font-weight:600;opacity:.8;letter-spacing:1px}
  .cta{background:#fff;color:#111;font-weight:900;font-size:17px;padding:15px 30px;border-radius:14px;
    box-shadow:0 12px 30px rgba(0,0,0,.3);display:inline-flex;align-items:center;gap:10px}
  .cta .arr{transition:transform .3s}
  .wm{position:absolute;bottom:16px;left:0;right:0;text-align:center;z-index:2;color:rgba(255,255,255,.8);
    font-size:12px;font-weight:700;letter-spacing:1px}
  .shine{position:absolute;top:0;bottom:0;width:40%;z-index:3;pointer-events:none;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-18deg)}
</style></head>
<body>
<div id="stage">
  <div class="bg"><div class="grad"></div><div class="blob b1"></div><div class="blob b2"></div><div class="noise"></div></div>
  <div class="shine" id="shine"></div>
  <div class="card">
    <div class="badge" id="badge"><span class="dot"></span> IKLAN · AdvertiseMaster</div>
    <div class="emoji-wrap"><div class="ring" id="ring"></div><div class="emoji" id="emoji">🛍️</div></div>
    <div class="brand" id="brand">Produk</div>
    <div class="tag" id="tag">Tagline</div>
    <div class="feats" id="feats"></div>
    <div class="row">
      <div class="price" id="price"><small>MULAI DARI</small><span id="priceVal">Rp 0</span></div>
      <div class="cta" id="cta">Beli <span class="arr">→</span></div>
    </div>
  </div>
  <div class="wm">✨ Dipersembahkan oleh AdvertiseMaster</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const THEMES = [
  {c1:'#6a5cff',c2:'#8b5cf6',c3:'#22d3ee',g1:'#a855f7',g2:'#22d3ee'},
  {c1:'#ff5f6d',c2:'#ff9966',c3:'#feb47b',g1:'#ff5f6d',g2:'#ffc371'},
  {c1:'#11998e',c2:'#38ef7d',c3:'#11998e',g1:'#38ef7d',g2:'#11998e'},
  {c1:'#2193b0',c2:'#6dd5ed',c3:'#2193b0',g1:'#6dd5ed',g2:'#2193b0'},
  {c1:'#ee0979',c2:'#ff6a00',c3:'#ee0979',g1:'#ff6a00',g2:'#ee0979'},
  {c1:'#4568dc',c2:'#b06ab3',c3:'#4568dc',g1:'#b06ab3',g2:'#4568dc'},
  {c1:'#0f2027',c2:'#2c5364',c3:'#00c6ff',g1:'#00c6ff',g2:'#2c5364'},
  {c1:'#f7971e',c2:'#ffd200',c3:'#f7971e',g1:'#ffd200',g2:'#f7971e'},
  {c1:'#c31432',c2:'#240b36',c3:'#c31432',g1:'#ff416c',g2:'#240b36'},
  {c1:'#1d976c',c2:'#93f9b9',c3:'#1d976c',g1:'#93f9b9',g2:'#1d976c'},
  {c1:'#8e2de2',c2:'#4a00e0',c3:'#8e2de2',g1:'#8e2de2',g2:'#4a00e0'},
  {c1:'#fc466b',c2:'#3f5efb',c3:'#fc466b',g1:'#3f5efb',g2:'#fc466b'},
];
const qid = parseInt(new URLSearchParams(location.search).get('id') || '1', 10);

(async function(){
  let products = [];
  try { products = await (await fetch('products.json')).json(); } catch(e){}
  const P = products.length ? products[(qid-1) % products.length] : {name:'Produk Spesial',emoji:'🛍️',tag:'Penawaran terbaik hari ini',price:'Rp 99.000',cta:'Beli Sekarang',feat:['Kualitas premium','Harga terbaik','Garansi resmi']};
  const TH = THEMES[(qid*5) % THEMES.length];
  const r = document.documentElement.style;
  r.setProperty('--c1',TH.c1); r.setProperty('--c2',TH.c2); r.setProperty('--c3',TH.c3);
  r.setProperty('--g1',TH.g1); r.setProperty('--g2',TH.g2);

  document.getElementById('emoji').textContent = P.emoji;
  document.getElementById('tag').textContent = P.tag;
  document.getElementById('priceVal').textContent = P.price;
  document.getElementById('cta').firstChild.textContent = (P.cta || 'Beli') + ' ';

  // brand letters
  const brand = document.getElementById('brand');
  brand.innerHTML = P.name.split('').map(c => `<span class="ch">${c===' '?'&nbsp;':c}</span>`).join('');

  // feature chips
  document.getElementById('feats').innerHTML = (P.feat||[]).slice(0,3)
    .map(f => `<span class="chip"><span class="ck">✓</span>${f}</span>`).join('');

  const chs = brand.querySelectorAll('.ch');
  const chips = document.querySelectorAll('.chip');
  gsap.set(['.badge','.emoji-wrap','.tag','.price','.cta'],{opacity:0});
  gsap.set(chs,{opacity:0,y:30}); gsap.set(chips,{opacity:0,y:14});
  gsap.set('#ring',{scale:.4,opacity:0});

  const tl = gsap.timeline({repeat:-1, repeatDelay:.6, defaults:{ease:'power3.out'}});
  tl.to('.badge',{opacity:1,y:0,duration:.5,onStart(){gsap.from('.badge',{y:-16})}})
    .to('#ring',{scale:1,opacity:1,duration:.8,ease:'elastic.out(1,.5)'},'-=.2')
    .to('.emoji-wrap',{opacity:1,duration:.5,onStart(){gsap.from('#emoji',{scale:.3,rotate:-25,duration:.8,ease:'back.out(1.7)'})}},'-=.7')
    .to(chs,{opacity:1,y:0,stagger:.035,duration:.5},'-=.3')
    .to('.tag',{opacity:1,y:0,duration:.5,onStart(){gsap.from('.tag',{y:18})}},'-=.1')
    .to(chips,{opacity:1,y:0,stagger:.12,duration:.4},'-=.1')
    .to('.price',{opacity:1,duration:.5,onStart(){gsap.from('.price',{scale:.5,ease:'back.out(2)'})}},'+=.1')
    .to('.cta',{opacity:1,duration:.5,onStart(){gsap.from('.cta',{scale:.6,ease:'back.out(2)'})}},'-=.3')
    .to({},{duration:2.4}) // hold
    .to('.card',{opacity:0,scale:.96,duration:.6,ease:'power2.in'})
    .set(chs,{opacity:0,y:30}).set(chips,{opacity:0,y:14})
    .set(['.badge','.emoji-wrap','.tag','.price','.cta'],{opacity:0})
    .set('.card',{opacity:1,scale:1});

  // idle loops
  gsap.to('#emoji',{y:-14,duration:1.8,ease:'sine.inOut',yoyo:true,repeat:-1});
  gsap.to('#ring',{rotate:360,duration:14,ease:'none',repeat:-1});
  gsap.to('.cta',{scale:1.06,duration:.9,ease:'sine.inOut',yoyo:true,repeat:-1});
  gsap.fromTo('#shine',{x:'-60%'},{x:'160%',duration:3.2,ease:'power1.inOut',repeat:-1,repeatDelay:1.6});
})();
</script>
</body></html>
